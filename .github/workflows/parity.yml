name: Cross-language gates

on:
  push:
    # `master`, not `main`: this repository has never had a `main` branch.
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26.x'

jobs:
  tree:
    name: tree correspondence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # cache: false throughout, there is no go.sum for setup-go to key on.
        with: { go-version: '${{ env.GO_VERSION }}', cache: false }
      - run: bash ci/hygiene.sh
      - run: bash ci/tree.sh

  goldens:
    name: TS-produced goldens are unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: source/ts/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache: false }
      - run: npm ci
        working-directory: source/ts
      - run: bash ci/goldens.sh
      - run: cd source/go && go test ./...

  parity:
    name: parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: source/ts/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache: false }
      - run: npm ci
        working-directory: source/ts
      - run: npx --prefix source/ts tsc -p source/go/parity/tsconfig.json
      - run: node --test source/go/parity/gate.test.mjs
      # A PIN failure without a BAND failure can be a host difference: leaf
      # counts are pinned per host, and the gate prints a block to re-pin from.
      - run: bash ci/parity.sh
      - name: dump sizes on failure
        if: failure()
        run: ls -l source/go/parity/out/

  generators:
    name: generated series match their generators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: source/ts/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}', cache: false }
      - run: npm ci
        working-directory: source/ts
      # Both languages ship a truncated copy of the same coefficient tables, and
      # each is written by a generator. Editing a generated file without its
      # generator is silent until someone regenerates and the edit vanishes.
      # Neither check runs in the ordinary suite: the Go one is behind GEN_FULL
      # because it takes three minutes, and the TypeScript side has no test at all.
      - name: Go series
        run: cd source/go && GEN_FULL=1 go test ./internal/gen/ -run TestGeneratorReproducesCommittedSeries -count=1
      - name: TypeScript series
        run: |
          bash generate/notes/ephemeris-generate.sh
          git diff --exit-code -- source/ts/src/astronomy/series/
