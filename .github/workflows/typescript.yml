name: TypeScript
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: source/ts

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: source/ts/package-lock.json
      - run: npm ci
      - run: npm run test:run

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/ts/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  hermes:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:hermes

  build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify dist contents
        run: |
          test -f dist/index.js     || (echo "Missing dist/index.js" && exit 1)
          test -f dist/index.cjs    || (echo "Missing dist/index.cjs" && exit 1)
          test -f dist/index.d.ts   || (echo "Missing dist/index.d.ts" && exit 1)
          test -f dist/index.d.cts  || (echo "Missing dist/index.d.cts" && exit 1)
          echo "All expected output files present"
      - name: Dry-run npm pack
        run: npm pack --dry-run
